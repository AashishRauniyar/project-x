<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20B2AA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#48D1CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20B2AA;stop-opacity:1" />
    </linearGradient>
    <filter id="emboss">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offset"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Stethoscope outline -->
  <path d="M40 60 Q40 40 60 40 L80 40 Q100 40 100 60 L100 140 Q100 160 80 160 L60 160 Q40 160 40 140 Z" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="8" 
        stroke-linecap="round"
        filter="url(#emboss)"/>
  
  <!-- Left ear tube -->
  <path d="M40 60 Q30 50 25 45 Q20 40 15 40" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#emboss)"/>
  
  <!-- Right ear tube -->
  <path d="M100 60 Q110 50 115 45 Q120 40 125 40" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#emboss)"/>
  
  <!-- Upper element - Health monitoring dial -->
  <g transform="translate(50, 70)">
    <!-- Semi-circular dial -->
    <path d="M0 20 A20 20 0 0 1 40 20" 
          fill="none" 
          stroke="url(#logoGradient)" 
          stroke-width="3"
          filter="url(#emboss)"/>
    
    <!-- Dial markings -->
    <line x1="20" y1="20" x2="20" y2="15" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="10" y1="18" x2="10" y2="14" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <line x1="30" y1="18" x2="30" y2="14" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <line x1="5" y1="16" x2="5" y2="13" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <line x1="35" y1="16" x2="35" y2="13" stroke="url(#logoGradient)" stroke-width="1.5"/>
  </g>
  
  <!-- Lower element - ECG waveform -->
  <g transform="translate(50, 120)">
    <path d="M0 10 L5 10 L7 5 L9 15 L11 5 L13 15 L15 5 L17 10 L22 10 L25 5 L28 15 L31 5 L34 15 L37 5 L40 10" 
          fill="none" 
          stroke="url(#logoGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round"
          filter="url(#emboss)"/>
  </g>
  
  <!-- Horizontal separator -->
  <line x1="50" y1="110" x2="90" y2="110" 
        stroke="url(#logoGradient)" 
        stroke-width="1.5"
        opacity="0.7"/>
</svg> 